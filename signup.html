{% extends "base.html" %}
{% block title %}Sign Up | Sunlytics{% endblock %}
{% block content %}
<section class="auth-wrapper">
  <div class="container">
    <div class="auth-card fade-in-up">
      <div class="text-center mb-4">
        <div class="avatar-circle"><i class="fa-solid fa-user-plus"></i></div>
        <h3>Create your account</h3>
        <p class="text-muted">Start predicting solar power output in minutes.</p>
      </div>
      <form method="POST" action="{{ url_for('signup') }}" novalidate>
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" value="{{ username or '' }}" placeholder="Choose a username" required minlength="3">
        </div>
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-control" value="{{ email or '' }}" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="At least 6 characters" required minlength="6">
        </div>
        <div class="mb-4">
          <label class="form-label">Confirm Password</label>
          <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter your password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-gradient w-100">Create Account</button>
      </form>
      <p class="text-center text-muted mt-4 mb-0">Already have an account? <a href="{{ url_for('login') }}" style="color:var(--accent); font-weight:600;">Log In</a></p>
    </div>
  </div>
</section>
{% endblock %}
